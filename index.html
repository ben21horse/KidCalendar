<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KidCalendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--surface:#fff;--ink:#14213d;--mute:#5d6b85;--line:#d6dfeb;--hr:#aebbd0;--qr:#d3dceb;--accent:#2f5bea;--on-accent:#fff;--today:#fff0b8;--ev:#cf2f2f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1628;--surface:#17233d;--ink:#e8eefc;--mute:#9fb0d0;--line:#2a3a5c;--hr:#4a5f8a;--qr:#2a3a5c;--accent:#7c9bff;--on-accent:#0e1628;--today:#3b3511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1628;--surface:#17233d;--ink:#e8eefc;--mute:#9fb0d0;--line:#2a3a5c;--hr:#4a5f8a;--qr:#2a3a5c;--accent:#7c9bff;--on-accent:#0e1628;--today:#3b3511;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:none;margin:0;padding:8px 10px;display:flex;flex-direction:column;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
header,.bar{flex:none}
#view{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
#view>.tgscroll{flex:1;min-height:0}
#view>.mhead,#view>.mgrid{flex:none}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav,.ctl,.seg{display:flex;gap:8px;align-items:center}
h1{margin:0;font-size:clamp(1.4rem,3.6vw,2.2rem);font-weight:800;letter-spacing:-.02em;min-width:7ch;text-align:center}
.arrow{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.arrow:hover{filter:brightness(1.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
.btn:hover{border-color:var(--accent)}
.seg{gap:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.spacer{flex:1}
#note{color:var(--mute);font-size:.85rem}
.tgscroll{--hh:56px;--gw:52px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;height:auto;min-height:0}
.tginner.wk{min-width:760px}
.tgtop{position:sticky;top:0;z-index:6;background:var(--surface);display:grid;grid-template-columns:var(--gw) repeat(var(--n),minmax(0,1fr));border-bottom:1px solid var(--hr)}
.dh2{display:flex;gap:8px;align-items:baseline;justify-content:center;padding:8px 4px;border-left:1px solid var(--line)}
.dh2.is-today{background:var(--today)}
.wd{color:var(--mute);font-weight:600}
.dn{font-size:1.6rem;font-weight:800;line-height:1}
.adl{font-size:.7rem;color:var(--mute);text-align:right;padding:6px 6px 0 0}
.adc{border-left:1px solid var(--line);padding:3px}
.chip{background:var(--evbg,var(--ev));color:var(--evfg,#fff);border-left:4px solid var(--evbd,var(--ev));border-radius:6px;padding:1px 8px;font-size:.8rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgbody{display:grid;grid-template-columns:var(--gw) repeat(var(--n),minmax(0,1fr));position:relative;border-bottom:1px solid var(--hr)}
.hours{position:relative;height:calc(24*var(--hh))}
.hl{position:absolute;right:8px;transform:translateY(-50%);font-size:.72rem;color:var(--mute);white-space:nowrap}
.lines{position:absolute;left:var(--gw);right:0;top:0;height:calc(24*var(--hh));pointer-events:none}
.ln{position:absolute;left:0;right:0;border-top:1px dashed var(--qr)}
.ln.h{border-top:1px solid var(--hr)}
.dcol{position:relative;height:calc(24*var(--hh));border-left:1px solid var(--line);overflow:hidden}
.dcol.is-today{background:color-mix(in srgb,var(--today) 45%,transparent)}
.ev{position:absolute;background:var(--evbg,var(--ev));color:var(--evfg,#fff);border-left:4px solid var(--evbd,var(--ev));border-radius:6px;padding:2px 6px;font-size:.8rem;line-height:1.25;overflow:hidden;box-shadow:0 0 0 1px var(--surface);z-index:2}
.ev b{display:block;font-weight:600}
.ev span{display:block;font-size:.72rem;opacity:.92}
.wk .ev{font-size:.72rem;padding:1px 4px}
.wk .ev span{font-size:.66rem}
.now{position:absolute;left:0;right:0;border-top:2px solid var(--accent);z-index:3}
.now::before{content:"";position:absolute;left:-1px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.scrollx{overflow-x:auto}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead div{padding:4px 6px;color:var(--mute);font-weight:600;font-size:.85rem}
.mgrid{gap:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:104px;padding:4px;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%}
.cell:hover{border-color:var(--accent)}
.cell.is-today{background:var(--today)}
.cell.dim{opacity:.5}
.cell .d{font-weight:600;font-size:.9rem;padding:0 3px}
.pill{background:var(--evbg,var(--ev));color:var(--evfg,#fff);border-left:3px solid var(--evbd,var(--ev));border-radius:4px;font-size:.75rem;line-height:1.25;padding:1px 5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.75rem;color:var(--mute);padding:2px 4px}
.chores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;flex:none}
.cbox{background:var(--bx);color:var(--bxi);border-radius:14px;padding:10px 12px 12px}
.p-beth{--bx:#c3ebbd;--bxi:#14391a;--bxl:#4a9f46;--bxs:#3d6b41;--bxd:#1f6b2c}
.p-lucy{--bx:#bde3fa;--bxi:#0f3550;--bxl:#3b8fc4;--bxs:#2f5f80;--bxd:#1b5d8f}
.p-rose{--bx:#cbbaf0;--bxi:#2a1458;--bxl:#7a58c0;--bxs:#58409a;--bxd:#4b2c9a}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cbox h2{margin:0;font-size:1.05rem;font-weight:800}
.undo{border:1px solid var(--bxl);background:rgba(255,255,255,.6);color:var(--bxi);border-radius:999px;font-size:.75rem;padding:2px 11px;flex:none}
.undo:hover:not(:disabled){background:#fff}
.undo:disabled{opacity:.4;cursor:default}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.tile{perspective:700px;background:none;border:0;padding:0;height:100px;text-align:left;border-radius:10px}
.tile.done{cursor:default}
.inner{position:relative;display:block;width:100%;height:100%;transition:transform .65s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.tile.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:rgba(255,255,255,.78);padding:8px 10px}
.front b{display:block;font-weight:600;font-size:.88rem;line-height:1.25}
.front small{display:block;font-size:.74rem;line-height:1.3;color:var(--bxs)}
.tile.t-due .front,.tile.t-over .front{box-shadow:inset 0 0 0 3px var(--bxd)}
.tile.t-due .front b,.tile.t-over .front b{font-size:1rem}
.tile.t-due .front small,.tile.t-over .front small{font-size:.82rem}
.tile.t-over .front{background:#f9c8c8}
.tile.t-over .front small{color:#7a2424}
.back{transform:rotateY(180deg)}
.back svg{display:block}
.k-lucy{--evbg:#b8e0f7;--evfg:#0c2e47;--evbd:#3b8fc4}
.k-rose{--evbg:#cbbaf0;--evfg:#2a1458;--evbd:#7a58c0}
.k-beth{--evbg:#c3ebbd;--evfg:#14391a;--evbd:#4a9f46}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}
@media (max-width:900px){.chores{grid-template-columns:1fr}.app{height:auto}#view{display:block;overflow:visible}#view>.tgscroll{height:70dvh;flex:none}}
@media (max-width:640px){.cell{min-height:70px}.pill{font-size:.68rem}.mhead div{padding:4px 2px}.tgscroll{--gw:44px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="nav">
      <button class="arrow" id="prev" aria-label="Previous"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h1 id="title"></h1>
      <button class="arrow" id="next" aria-label="Next"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4 13.5 10l-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="ctl">
      <button class="btn" id="today">Today</button>
      <div class="seg" role="group" aria-label="View">
        <button data-v="3day">3 days</button>
        <button data-v="week">Week</button>
        <button data-v="month">Month</button>
      </div>
    </div>
  </header>
  <div class="bar">
    <span id="note">Sample events are shown. Set your Worker address at the bottom of this file to see your own.</span>
    <span class="spacer"></span>
    <button class="btn" id="imp">Import .ics file</button>
    <input type="file" id="file" accept=".ics,text/calendar" hidden>
  </div>
  <div id="view"></div>
  <div class="chores" id="chores"></div>
</div>
<script>
const HH=56;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const same=(a,b)=>a.toDateString()===b.toDateString();
const TODAY=sod(new Date());
const fmt=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ev(off,h,m,dur,title,loc){const s=add(TODAY,off);s.setHours(h,m);return{title,loc,start:s,end:new Date(s.getTime()+dur*6e4),allDay:false}}
function ad(off,title){return{title,start:add(TODAY,off),end:add(TODAY,off+1),allDay:true}}
const sample=[
 ev(0,8,15,30,'School drop-off','Berkshire Elementary'),
 ev(0,8,30,60,'Dentist'),
 ev(0,15,45,60,'Lucy: soccer practice','Boyer Park'),
 ev(0,16,0,45,'Rose: piano lesson','Keys Studio'),
 ev(0,16,15,60,'Beth: swim team','Community Pool'),
 ev(1,16,0,90,'Robotics club','Room 112'),
 ev(1,18,30,60,'Family dinner at Grandma’s'),
 ad(2,'Berkshire picture day'),
 ev(2,9,0,60,'Beth: orthodontist'),
 ev(2,15,30,60,'Lucy: art class'),
 ev(2,16,0,60,'Honors choir rehearsal','Music Hall'),
 ev(3,13,0,90,'Honors orchestra','Music Hall'),
 ev(3,10,0,120,'Birthday party','Jump Zone'),
 ev(4,11,0,90,'Rose: soccer game','Boyer Park'),
 ad(5,'No school'),
 ev(6,14,0,60,'Parent–teacher conference'),
 ev(8,16,30,60,'Beth: swim team'),
 ev(9,17,0,60,'Lucy: piano recital','Keys Studio'),
 ev(-2,16,0,60,'Lucy: soccer practice','Boyer Park')
];
/* Events take the color of each girl they mention (Robotics and Honors Orchestra are Lucy; Honors Choir is Beth and Rose); everything else stays red */
const kindsOf=e=>{
  const t=`${e.title} ${e.loc||''} ${e.desc||''}`,k=[];
  if(/\blucy\b|robotics|honors\s+orchestra/i.test(t))k.push('k-lucy');
  if(/\brose\b|honors\s+choir/i.test(t))k.push('k-rose');
  if(/\bbeth\b|honors\s+choir/i.test(t))k.push('k-beth');
  if(!k.length&&/berkshire/i.test(t))k.push('k-lucy');   /* Berkshire only counts when nothing else matched */
  return k.length?k:[''];
};
const tagged=list=>list.flatMap(e=>kindsOf(e).map(k=>({...e,k})));  /* an event for two girls is shown twice, once in each color */
let events=tagged(sample);
let view='3day',anchor=TODAY;
let gridScroll=Math.max(6,new Date().getHours()-1)*HH;

const eventsOn=day=>{const a=day,b=add(day,1);return events.filter(e=>e.start<b&&e.end>a)};

/* Place timed events for one day; overlapping events share the width of the day column side by side */
function timedLayout(day){
  const a=+day,b=+add(day,1);
  const L=eventsOn(day).filter(e=>!e.allDay).map(e=>{
    const s=(Math.max(+e.start,a)-a)/6e4,t=(Math.min(+e.end,b)-a)/6e4;
    return{e,s,t:Math.max(t,s+30)}}).sort((x,y)=>x.s-y.s||y.t-x.t);
  const out=[];let cl=[],end=-1;
  const flush=()=>{const cols=[];
    cl.forEach(o=>{let i=cols.findIndex(x=>x<=o.s);if(i<0){i=cols.length;cols.push(0)}cols[i]=o.t;o.c=i});
    cl.forEach(o=>o.n=cols.length);out.push(...cl);cl=[]};
  for(const o of L){if(cl.length&&o.s>=end){flush();end=-1}cl.push(o);end=Math.max(end,o.t)}
  flush();return out;
}
const blk=o=>{const e=o.e;
  return `<div class="ev ${e.k}" title="${esc(e.title)}${e.loc?' – '+esc(e.loc):''}" style="top:${o.s*HH/60}px;height:${(o.t-o.s)*HH/60-1}px;left:calc(${o.c/o.n*100}% + 2px);width:calc(${100/o.n}% - 4px)"><b>${esc(e.title)}</b><span>${fmt(e.start)} – ${fmt(e.end)}</span>${e.loc?`<span>${esc(e.loc)}</span>`:''}</div>`};

function grid(days,wk){
  const n=days.length,now=new Date(),nowMin=(now-sod(now))/6e4;
  const hasAD=days.some(d=>eventsOn(d).some(e=>e.allDay));
  let top='<div class="tgtop"><div></div>'+days.map(d=>`<div class="dh2${same(d,TODAY)?' is-today':''}"><span class="wd">${d.toLocaleDateString([],{weekday:'short'})}</span><span class="dn">${d.getDate()}</span></div>`).join('');
  if(hasAD)top+='<div class="adl">all-day</div>'+days.map(d=>`<div class="adc">${eventsOn(d).filter(e=>e.allDay).map(e=>`<div class="chip ${e.k}">${esc(e.title)}</div>`).join('')}</div>`).join('');
  top+='</div>';
  let hours='',lines='';
  for(let h=0;h<24;h++){
    if(h)hours+=`<div class="hl" style="top:${h*HH}px">${h===12?'12 PM':h<12?h+' AM':(h-12)+' PM'}</div>`;
    lines+=`<div class="ln h" style="top:${h*HH}px"></div>`;
    for(let q=1;q<4;q++)lines+=`<div class="ln" style="top:${h*HH+q*HH/4}px"></div>`;
  }
  const cols=days.map(d=>{const t=same(d,TODAY);
    return `<div class="dcol${t?' is-today':''}">${timedLayout(d).map(blk).join('')}${t?`<div class="now" style="top:${nowMin*HH/60}px"></div>`:''}</div>`}).join('');
  return `<div class="tgscroll"><div class="tginner${wk?' wk':''}" style="--n:${n}">${top}<div class="tgbody"><div class="hours">${hours}</div><div class="lines">${lines}</div>${cols}</div></div></div>`;
}

const weekStart=d=>add(sod(d),-d.getDay());
const range=(a,b)=>{const o={month:'short',day:'numeric'};return a.toLocaleDateString([],o)+' – '+(a.getMonth()===b.getMonth()?b.getDate():b.toLocaleDateString([],o))};

function render(){
  const old=document.querySelector('.tgscroll');if(old)gridScroll=old.scrollTop;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  const el=document.getElementById('view'),T=document.getElementById('title');
  if(view==='3day'){
    T.textContent=range(anchor,add(anchor,2));
    el.innerHTML=grid([0,1,2].map(i=>add(anchor,i)),false);
  }else if(view==='week'){
    const s=weekStart(anchor);T.textContent=range(s,add(s,6));
    el.innerHTML=grid([0,1,2,3,4,5,6].map(i=>add(s,i)),true);
  }else{
    const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
    const dim=new Date(anchor.getFullYear(),anchor.getMonth()+1,0).getDate();
    const weeks=Math.ceil((first.getDay()+dim)/7),gs=add(first,-first.getDay());
    T.textContent=first.toLocaleDateString([],{month:'long',year:'numeric'});
    let h='<div class="mhead">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="mgrid">';
    for(let i=0;i<weeks*7;i++){
      const d=add(gs,i),list=eventsOn(d).sort((x,y)=>(y.allDay-x.allDay)||(x.start-y.start));
      h+=`<button class="cell${same(d,TODAY)?' is-today':''}${d.getMonth()!==first.getMonth()?' dim':''}" data-day="${d.getTime()}" aria-label="${d.toDateString()}, ${list.length} events"><div class="d">${d.getDate()}</div>${list.slice(0,3).map(e=>`<div class="pill ${e.k}">${e.allDay?'':fmt(e.start).replace(/ ?[AP]M/,'')+' '}${esc(e.title)}</div>`).join('')}${list.length>3?`<div class="more">+${list.length-3} more</div>`:''}</button>`;
    }
    el.innerHTML=h+'</div>';
  }
  const sc=el.querySelector('.tgscroll');if(sc)sc.scrollTop=gridScroll;
}
function shift(dir){
  if(view==='3day')anchor=add(anchor,3*dir);
  else if(view==='week')anchor=add(anchor,7*dir);
  else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+dir,1);
  render();
}
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('today').onclick=()=>{anchor=TODAY;render()};
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(view==='month'&&b.dataset.v!=='month'&&anchor.getMonth()===TODAY.getMonth()&&anchor.getFullYear()===TODAY.getFullYear())anchor=TODAY;
  view=b.dataset.v;render()};
document.getElementById('view').onclick=e=>{const c=e.target.closest('[data-day]');if(c){anchor=sod(new Date(+c.dataset.day));view='3day';render()}};

/* .ics parsing */
const unesc=v=>v.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1');
function pd(v){const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)(Z)?)?/);if(!m)return null;
  return m[7]?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6])):new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0))}
function parseICS(t){
  t=t.replace(/\r?\n[ \t]/g,'');const out=[];let c=null;
  for(const line of t.split(/\r?\n/)){
    if(line==='BEGIN:VEVENT')c={};
    else if(line==='END:VEVENT'){
      if(c&&c.s){const e=c.e||(c.ad?add(c.s,1):c.s);
        out.push({title:c.t||'(No title)',loc:c.l,start:c.s,end:e>c.s?e:new Date(+c.s+6e4),allDay:!!c.ad,desc:c.desc,r:c.r,x:c.x})}
      c=null;
    }else if(c){
      const i=line.indexOf(':');if(i<0)continue;
      const k=line.slice(0,i),v=line.slice(i+1),n=k.split(';')[0];
      if(n==='SUMMARY')c.t=unesc(v);
      else if(n==='LOCATION')c.l=unesc(v);
      else if(n==='DESCRIPTION')c.desc=unesc(v);
      else if(n==='DTSTART'){c.ad=/VALUE=DATE(?!-)/.test(k);c.s=pd(v)}
      else if(n==='DTEND')c.e=pd(v);
      else if(n==='RRULE')c.r=v;
      else if(n==='EXDATE')(c.x=c.x||[]).push(...v.split(',').map(pd));
    }
  }
  return out;
}
/* Repeating events: DAILY, WEEKLY (with BYDAY), MONTHLY and YEARLY by date; honors INTERVAL, COUNT, UNTIL, EXDATE */
function expand(e){
  if(!e.r)return[e];
  const from=add(TODAY,-366),to=add(TODAY,366);
  const R=Object.fromEntries(e.r.split(';').map(p=>p.split('=')));
  const step=+(R.INTERVAL||1),until=R.UNTIL?pd(R.UNTIL):null,max=R.COUNT?+R.COUNT:Infinity;
  const dur=e.end-e.start,ex=new Set((e.x||[]).map(d=>+d));
  const days=R.BYDAY?R.BYDAY.split(',').map(s=>['SU','MO','TU','WE','TH','FR','SA'].indexOf(s.slice(-2))):null;
  const s0=sod(e.start),out=[];let n=0;
  for(let d=new Date(e.start),i=0;d<=to&&(!until||d<=until)&&n<max&&i<6000;d=add(d,1),i++){
    const k=Math.round((sod(d)-s0)/864e5);let ok=false;
    if(R.FREQ==='DAILY')ok=k%step===0;
    else if(R.FREQ==='WEEKLY'){const w=Math.round((sod(add(d,-d.getDay()))-sod(add(e.start,-e.start.getDay())))/6048e5);
      ok=w%step===0&&(days?days.includes(d.getDay()):d.getDay()===e.start.getDay())}
    else if(R.FREQ==='MONTHLY')ok=d.getDate()===e.start.getDate()&&((d.getFullYear()-e.start.getFullYear())*12+d.getMonth()-e.start.getMonth())%step===0;
    else if(R.FREQ==='YEARLY')ok=d.getDate()===e.start.getDate()&&d.getMonth()===e.start.getMonth()&&(d.getFullYear()-e.start.getFullYear())%step===0;
    if(!ok)continue;
    n++;
    const end=new Date(+d+dur);
    if(end>from&&!ex.has(+d))out.push({...e,start:new Date(d),end,r:null});
  }
  return out;
}
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const got=parseICS(await f.text());
  events=tagged(got.flatMap(x=>expand(x)));
  document.getElementById('note').textContent=got.length?`Loaded ${got.length} events from ${f.name}.`:'No events found in that file. Export a calendar from Google Calendar as .ics and try again.';
  render();
};

/* Live feeds: set WORKER to your Cloudflare Worker address. Each id must match a key in the Worker. */
const WORKER='https://kidcalendar-feeds.ben-langhorst.workers.dev/';
const FEEDS=[{id:'first',cal:'family'}];
async function loadFeeds(){
  if(WORKER.includes('YOUR-WORKER'))return;
  const all=[],failed=[];
  for(const f of FEEDS){
    try{
      const r=await fetch(`${WORKER.replace(/\/$/,'')}/?id=${encodeURIComponent(f.id)}`);
      if(!r.ok)throw new Error(r.status);
      all.push(...parseICS(await r.text()));
    }catch(err){failed.push(f.id)}
  }
  events=tagged(all.flatMap(x=>expand(x)));
  document.getElementById('note').textContent=failed.length?`Couldn’t load: ${failed.join(', ')}. Check the Worker address and feed names.`:`Loaded ${FEEDS.length} calendar${FEEDS.length>1?'s':''}.`;
  render();
}
/* Chores: click a tile to complete it (ding + flip to a wildflower meadow); Undo reverses the latest one */
const FC={pink:'#f28cb8',purple:'#9b6fd6',yellow:'#ffd23f',white:'#fffaf0',orange:'#ff9a4d',blue:'#6f9df0'};
const defs=`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec5f5"/><stop offset=".65" stop-color="#d9efff"/><stop offset="1" stop-color="#fff1d6"/></linearGradient>${
  Object.entries(FC).map(([k,c])=>`<symbol id="f-${k}" viewBox="-10 -10 20 20"><g fill="${c}">${[0,1,2,3,4,5].map(a=>`<ellipse cx="0" cy="-5.2" rx="2.9" ry="5" transform="rotate(${a*60})"/>`).join('')}</g><circle r="2.6" fill="${k==='yellow'?'#d97a00':'#ffcf33'}"/></symbol>`).join('')
}</defs></svg>`;

function meadow(seed){
  let a=seed>>>0;
  const r=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};
  const keys=Object.keys(FC);
  let s='<svg viewBox="0 0 200 150" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">'
   +'<rect width="200" height="150" fill="url(#sky)"/><circle cx="162" cy="26" r="12" fill="#fff6c9" opacity=".9"/>'
   +'<path d="M0 78 Q40 55 90 72 T200 62 V150 H0Z" fill="#a8d693"/><path d="M0 92 Q60 70 120 88 T200 82 V150 H0Z" fill="#7bbd6b"/><rect y="104" width="200" height="46" fill="#5fa653"/>';
  const fl=[];for(let i=0;i<30;i++)fl.push({x:6+r()*188,y:92+r()*52,k:keys[Math.floor(r()*keys.length)],b:(r()-.5)*8});
  fl.sort((p,q)=>p.y-q.y);
  for(const f of fl){
    const t=(f.y-92)/52,sz=11+t*14;
    s+=`<path d="M${f.x.toFixed(1)} ${f.y.toFixed(1)} q${f.b.toFixed(1)} 12 ${(f.b/2).toFixed(1)} ${(152-f.y).toFixed(1)}" stroke="#3f8a3a" stroke-width="1.3" fill="none"/>`
      +`<use href="#f-${f.k}" x="${(f.x-sz/2).toFixed(1)}" y="${(f.y-sz/2).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}"/>`;
  }
  return s+'</svg>';
}
const seedOf=(name,i)=>[...name].reduce((s,c)=>s*31+c.charCodeAt(0),7)+i*9973;

/* A short, bright two-note "ting-ding": quick attack, glassy overtones, fast fade */
let ac;
function ding(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime;
    [[1318.5,0,.5],[1975.5,.09,.75]].forEach(([f,dt,d])=>{
      [[1,.22],[2,.07],[3.01,.03]].forEach(([m,v])=>{
        const o=ac.createOscillator(),g=ac.createGain(),t=t0+dt;
        o.type='sine';o.frequency.value=f*m;
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(v,t+.004);
        g.gain.exponentialRampToValueAtTime(.0001,t+d/Math.sqrt(m));
        o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);
      });
    });
  }catch(e){}
}

/* Chore schedule. Day 0 is START; each chore repeats every N days, shifted by "off" days. */
const WINDOW=36*36e5;               /* a completed tile stays flipped for 36 hours */
const START=new Date(2026,10,18);   /* Nov 18, 2026 */
const dayIdx=d=>Math.round((sod(d)-START)/864e5);
const SAT=(6-START.getDay()+7)%7;  /* day index offset of the first Saturday */
const PEOPLE={
  Beth:{cls:'p-beth',chores:[{id:'wipe',name:'Wipe the table',every:2,off:1},{id:'sweep',name:'Sweep the floor',every:2,off:0},{id:'room',name:'Tidy room',every:7,off:SAT,span:2}]},
  Lucy:{cls:'p-lucy',chores:[{id:'fold',name:'Fold clothes',every:2,off:0},{id:'desk',name:'Tidy kitchen desk',every:2,off:1},{id:'bed',name:'Tidy bedroom',every:3,off:0}]},
  Rose:{cls:'p-rose',chores:[{id:'wipe',name:'Wipe the table',every:2,off:0},{id:'sweep',name:'Sweep the floor',every:2,off:1},{id:'room',name:'Tidy room',every:7,off:SAT,span:2}]}
};

/* Completed chores per person as {k:'chore|dayIndex', t:timestamp}, kept in this browser */
let done={Beth:[],Lucy:[],Rose:[]};
try{
  const s=JSON.parse(localStorage.getItem('kidcal-done-v2')||'null');
  if(s)for(const p in done)done[p]=(s[p]||[]).filter(x=>x&&x.k&&Date.now()-x.t<14*864e5);
}catch(e){}
const saveDone=()=>{try{localStorage.setItem('kidcal-done-v2',JSON.stringify(done))}catch(e){}};

const inst=(p,key)=>{const [cid,d]=key.split('|'),i=PEOPLE[p].chores.findIndex(c=>c.id===cid);return{key,d:+d,i,c:PEOPLE[p].chores[i]}};
const byDue=(a,b)=>a.d-b.d||a.i-b.i;

/* Tiles to show: recently completed ones (they keep their slot for 36 hours), then the soonest not-yet-done ones, three in all.
   A missed chore stays (as overdue) only until its next occurrence comes due. */
function visible(p,now){
  const T=dayIdx(new Date(now)),dn=new Set(done[p].map(x=>x.k));
  const C=done[p].filter(x=>now-x.t<WINDOW).map(x=>inst(p,x.k)).filter(x=>x.c);
  const P=[];
  PEOPLE[p].chores.forEach((c,i)=>{
    const m=(((T-c.off)%c.every)+c.every)%c.every;
    for(let d=T-m;d<=T+30;d+=c.every){if(d<0)continue;const k=c.id+'|'+d;if(!dn.has(k))P.push({key:k,d,i,c})}
  });
  P.sort(byDue);
  return[...C,...P.slice(0,Math.max(0,3-C.length))].sort(byDue);
}
const SPAN=x=>x.c.span||1;   /* weekend chores are due Saturday through Sunday */
const status=(x,now)=>{const T=dayIdx(new Date(now));return T<x.d?'':T<=x.d+SPAN(x)-1?'due':'over'};
const dueText=(x,now)=>{
  const T=dayIdx(new Date(now)),e=x.d+SPAN(x)-1,shown=T>x.d&&T<=e?T:x.d;
  return[`Due ${add(START,shown).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})}`,
    T>e?`${T-e} day${T-e>1?'s':''} overdue`:T>=x.d?'Today':x.d-T===1?'Tomorrow':`${x.d-T} days away`];
};

document.getElementById('chores').innerHTML=defs+Object.entries(PEOPLE).map(([p,v])=>
  `<section class="cbox ${v.cls}" data-box="${p}"><div class="chead"><h2>${p}’s Upcoming Chores</h2><button class="undo" data-undo="${p}" aria-label="Undo last completed chore for ${p}">Undo</button></div><div class="tiles"></div></section>`).join('');

function makeTile(p,x){
  const el=document.createElement('button');
  el.className='tile';el.dataset.p=p;el.dataset.k=x.key;
  el.innerHTML=`<span class="inner"><span class="face front"><b></b><small></small><small></small></span><span class="face back">${meadow(seedOf(p+x.c.id,x.d))}</span></span>`;
  return el;
}
/* Reuses existing tiles so a newly completed tile animates its flip; only expired or new tiles are removed or added */
function renderChores(){
  const now=Date.now();
  for(const p in PEOPLE){
    const box=document.querySelector(`[data-box="${p}"] .tiles`),list=visible(p,now);
    const have=Array.from(box.children),keep=new Set(list.map(x=>x.key));
    have.forEach(t=>{if(!keep.has(t.dataset.k))t.remove()});
    list.forEach((x,idx)=>{
      let t=Array.from(box.children).find(c=>c.dataset.k===x.key);
      const isDone=done[p].some(y=>y.k===x.key&&now-y.t<WINDOW);
      if(!t){t=makeTile(p,x);if(isDone)t.classList.add('done')}
      else t.classList.toggle('done',isDone);
      const [a,b]=dueText(x,now),st=status(x,now);
      t.classList.toggle('t-due',st==='due');t.classList.toggle('t-over',st==='over');
      t.querySelector('b').textContent=x.c.name;
      const s=t.querySelectorAll('small');s[0].textContent=a;s[1].textContent=b;
      t.setAttribute('aria-pressed',isDone);
      t.setAttribute('aria-label',`${x.c.name}, ${a}, ${b}${isDone?', completed':''}`);
      if(box.children[idx]!==t)box.insertBefore(t,box.children[idx]||null);
    });
    document.querySelector(`[data-undo="${p}"]`).disabled=!done[p].some(y=>now-y.t<WINDOW);
  }
}
document.getElementById('chores').onclick=e=>{
  const now=Date.now(),u=e.target.closest('.undo');
  if(u){
    const p=u.dataset.undo;
    for(let i=done[p].length-1;i>=0;i--)if(now-done[p][i].t<WINDOW){done[p].splice(i,1);break}
    saveDone();renderChores();return;
  }
  const t=e.target.closest('.tile');
  if(t&&!t.classList.contains('done')){done[t.dataset.p].push({k:t.dataset.k,t:now});saveDone();renderChores();ding()}
};
renderChores();
setInterval(renderChores,30000);
document.addEventListener('visibilitychange',renderChores);
render();loadFeeds();
</script>
</body>
