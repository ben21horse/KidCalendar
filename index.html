<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KidCalendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--surface:#fff;--ink:#14213d;--mute:#5d6b85;--line:#d6dfeb;--accent:#2f5bea;--on-accent:#fff;--today:#fff0b8;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1628;--surface:#17233d;--ink:#e8eefc;--mute:#9fb0d0;--line:#2a3a5c;--accent:#7c9bff;--on-accent:#0e1628;--today:#3b3511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1628;--surface:#17233d;--ink:#e8eefc;--mute:#9fb0d0;--line:#2a3a5c;--accent:#7c9bff;--on-accent:#0e1628;--today:#3b3511;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.nav,.seg{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
.btn:hover{border-color:var(--accent)}
.seg{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 8px;font-size:.9rem}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.spacer{flex:1}
#note{color:var(--mute);font-size:.85rem}
.scroll{overflow-x:auto}
.cols{display:grid;gap:10px}
.c3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.c7{grid-template-columns:repeat(7,minmax(118px,1fr));min-width:830px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:260px}
.col.is-today,.cell.is-today{background:var(--today)}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.wd{color:var(--mute);font-weight:600}
.dn{font-size:1.9rem;font-weight:800;line-height:1}
.tag{margin-left:auto;font-size:.8rem;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:1px 9px}
.ev{border-left:5px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));border-radius:8px;padding:6px 8px;margin-bottom:6px}
.ev .t{font-size:.8rem;color:var(--mute)}
.ev .n{font-weight:600}
.ev .l,.ev .who{font-size:.82rem;color:var(--mute)}
.empty{color:var(--mute);font-size:.9rem;padding:8px 2px}
.mhead,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mhead div{padding:4px 6px;color:var(--mute);font-weight:600;font-size:.85rem}
.mgrid{gap:4px}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:104px;padding:4px;overflow:hidden;cursor:pointer;text-align:left;display:block;width:100%}
.cell:hover{border-color:var(--accent)}
.cell.dim{opacity:.5}
.cell .d{font-weight:600;font-size:.9rem;padding:0 3px}
.pill{border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--surface));border-radius:4px;font-size:.75rem;line-height:1.25;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{font-size:.75rem;color:var(--mute);padding:2px 4px}
@media (max-width:640px){.cell{min-height:70px}.pill{font-size:.68rem}.mhead div{padding:4px 2px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <div class="nav">
      <button class="btn" id="prev" aria-label="Previous">&lsaquo;</button>
      <button class="btn" id="today">Today</button>
      <button class="btn" id="next" aria-label="Next">&rsaquo;</button>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button data-v="3day">3 days</button>
      <button data-v="week">Week</button>
      <button data-v="month">Month</button>
    </div>
  </header>
  <div class="bar">
    <span id="legend" style="display:contents"></span>
    <span class="spacer"></span>
    <button class="btn" id="imp">Import .ics file</button>
    <input type="file" id="file" accept=".ics,text/calendar" hidden>
  </div>
  <div id="note">Sample events are shown. Import an .ics file exported from Google Calendar to see your own.</div>
  <div id="view" style="margin-top:12px"></div>
</div>
<script>
const CALS={maya:{n:'Maya',c:'#e4572e'},leo:{n:'Leo',c:'#17a398'},family:{n:'Family',c:'#6b4fd8'},imported:{n:'Imported',c:'#7b8494'}};
const hidden=new Set();
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const same=(a,b)=>a.toDateString()===b.toDateString();
const TODAY=sod(new Date());
const fmt=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function ev(off,h,m,dur,title,cal,loc){const s=add(TODAY,off);s.setHours(h,m);return{title,cal,loc,start:s,end:new Date(s.getTime()+dur*6e4),allDay:false}}
function ad(off,title,cal){return{title,cal,start:add(TODAY,off),end:add(TODAY,off+1),allDay:true}}
const sample=[
 ev(0,8,15,30,'School drop-off','family','Lincoln Elementary'),
 ev(0,15,45,60,'Soccer practice','leo','Boyer Park'),
 ev(0,17,30,45,'Piano lesson','maya','Keys Studio'),
 ev(1,16,0,90,'Swim team','maya','Community Pool'),
 ev(1,18,30,60,'Family dinner at Grandma’s','family'),
 ad(2,'Picture day','leo'),
 ev(2,9,0,60,'Dentist','maya','Dr. Patel'),
 ev(2,15,30,60,'Robotics club','leo','Room 112'),
 ev(3,10,0,120,'Birthday party','maya','Jump Zone'),
 ev(4,11,0,90,'Soccer game','leo','Boyer Park'),
 ad(5,'No school','family'),
 ev(6,14,0,60,'Parent–teacher conference','family'),
 ev(8,16,30,60,'Swim team','maya'),
 ev(9,17,0,60,'Piano recital','maya','Keys Studio'),
 ev(11,9,0,60,'Pediatrician','leo'),
 ev(-2,16,0,60,'Soccer practice','leo','Boyer Park'),
 ev(-5,12,0,120,'Playdate','maya')
];
let events=[...sample];
let view='3day',anchor=TODAY;

function eventsOn(day){
  const a=day,b=add(day,1);
  return events.filter(e=>!hidden.has(e.cal)&&e.start<b&&e.end>a)
    .sort((x,y)=>(y.allDay-x.allDay)||(x.start-y.start));
}
const card=(e,full)=>`<div class="ev" style="--c:${CALS[e.cal].c}"><div class="t">${e.allDay?'All day':fmt(e.start)+(full?' – '+fmt(e.end):'')}</div><div class="n">${esc(e.title)}</div>${full&&e.loc?`<div class="l">${esc(e.loc)}</div>`:''}${full?`<div class="who">${CALS[e.cal].n}</div>`:''}</div>`;
const dayCol=(d,full)=>{
  const list=eventsOn(d),t=same(d,TODAY);
  return `<section class="col${t?' is-today':''}"><div class="dh"><span class="wd">${d.toLocaleDateString([],{weekday:'short'})}</span><span class="dn">${d.getDate()}</span>${t?'<span class="tag">Today</span>':''}</div>${list.length?list.map(e=>card(e,full)).join(''):'<div class="empty">Nothing planned</div>'}</section>`;
};
const weekStart=d=>add(sod(d),-d.getDay());
const range=(a,b)=>{const o={month:'short',day:'numeric'};return a.toLocaleDateString([],o)+' – '+(a.getMonth()===b.getMonth()?b.getDate():b.toLocaleDateString([],o))};

function render(){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===view));
  const el=document.getElementById('view'),T=document.getElementById('title');
  if(view==='3day'){
    T.textContent=range(anchor,add(anchor,2));
    el.innerHTML=`<div class="cols c3">${[0,1,2].map(i=>dayCol(add(anchor,i),true)).join('')}</div>`;
  }else if(view==='week'){
    const s=weekStart(anchor);T.textContent=range(s,add(s,6));
    el.innerHTML=`<div class="scroll"><div class="cols c7">${[0,1,2,3,4,5,6].map(i=>dayCol(add(s,i),false)).join('')}</div></div>`;
  }else{
    const first=new Date(anchor.getFullYear(),anchor.getMonth(),1);
    const dim=new Date(anchor.getFullYear(),anchor.getMonth()+1,0).getDate();
    const weeks=Math.ceil((first.getDay()+dim)/7),gs=add(first,-first.getDay());
    T.textContent=first.toLocaleDateString([],{month:'long',year:'numeric'});
    let h='<div class="mhead">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="mgrid">';
    for(let i=0;i<weeks*7;i++){
      const d=add(gs,i),list=eventsOn(d);
      h+=`<button class="cell${same(d,TODAY)?' is-today':''}${d.getMonth()!==first.getMonth()?' dim':''}" data-day="${d.getTime()}" aria-label="${d.toDateString()}, ${list.length} events"><div class="d">${d.getDate()}</div>${list.slice(0,3).map(e=>`<div class="pill" style="--c:${CALS[e.cal].c}">${e.allDay?'':fmt(e.start).replace(/ ?[AP]M/,'')+' '}${esc(e.title)}</div>`).join('')}${list.length>3?`<div class="more">+${list.length-3} more</div>`:''}</button>`;
    }
    el.innerHTML=h+'</div>';
  }
}
function shift(dir){
  if(view==='3day')anchor=add(anchor,3*dir);
  else if(view==='week')anchor=add(anchor,7*dir);
  else anchor=new Date(anchor.getFullYear(),anchor.getMonth()+dir,1);
  render();
}
document.getElementById('prev').onclick=()=>shift(-1);
document.getElementById('next').onclick=()=>shift(1);
document.getElementById('today').onclick=()=>{anchor=TODAY;render()};
document.querySelector('.seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.v==='3day'&&view!=='3day'&&anchor.getMonth()===TODAY.getMonth()&&anchor.getFullYear()===TODAY.getFullYear()&&view==='month')anchor=TODAY;
  view=b.dataset.v;render()};
document.getElementById('view').onclick=e=>{const c=e.target.closest('[data-day]');if(c){anchor=sod(new Date(+c.dataset.day));view='3day';render()}};

function legend(){
  document.getElementById('legend').innerHTML=Object.entries(CALS).map(([k,v])=>`<button class="chip" data-cal="${k}" aria-pressed="${!hidden.has(k)}" style="--c:${v.c}"><i></i>${v.n}</button>`).join('');
}
document.getElementById('legend').onclick=e=>{const b=e.target.closest('[data-cal]');if(!b)return;
  hidden.has(b.dataset.cal)?hidden.delete(b.dataset.cal):hidden.add(b.dataset.cal);legend();render()};

/* .ics import (single events only; repeating events aren’t expanded yet) */
const unesc=v=>v.replace(/\\n/gi,' ').replace(/\\([,;\\])/g,'$1');
function pd(v){const m=v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)(Z)?)?/);if(!m)return null;
  return m[7]?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6])):new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0))}
function parseICS(t){
  t=t.replace(/\r?\n[ \t]/g,'');const out=[];let c=null;
  for(const line of t.split(/\r?\n/)){
    if(line==='BEGIN:VEVENT')c={};
    else if(line==='END:VEVENT'){
      if(c&&c.s){const e=c.e||(c.ad?add(c.s,1):c.s);
        out.push({title:c.t||'(No title)',cal:'imported',loc:c.l,start:c.s,end:e>c.s?e:new Date(+c.s+6e4),allDay:!!c.ad,r:c.r,x:c.x})}
      c=null;
    }else if(c){
      const i=line.indexOf(':');if(i<0)continue;
      const k=line.slice(0,i),v=line.slice(i+1),n=k.split(';')[0];
      if(n==='SUMMARY')c.t=unesc(v);
      else if(n==='LOCATION')c.l=unesc(v);
      else if(n==='DTSTART'){c.ad=/VALUE=DATE(?!-)/.test(k);c.s=pd(v)}
      else if(n==='DTEND')c.e=pd(v);
      else if(n==='RRULE')c.r=v;
      else if(n==='EXDATE')(c.x=c.x||[]).push(...v.split(',').map(pd));
    }
  }
  return out;
}
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const got=parseICS(await f.text());
  events=got.flatMap(e=>expand(e));
  document.getElementById('note').textContent=got.length?`Imported ${got.length} events from ${f.name}.`:'No events found in that file. Export a calendar from Google Calendar as .ics and try again.';
  legend();render();
};
/* Repeating events: DAILY, WEEKLY (with BYDAY), MONTHLY and YEARLY by date; honors INTERVAL, COUNT, UNTIL, EXDATE */
function expand(e){
  if(!e.r)return[e];
  const from=add(TODAY,-366),to=add(TODAY,366);
  const R=Object.fromEntries(e.r.split(';').map(p=>p.split('=')));
  const step=+(R.INTERVAL||1),until=R.UNTIL?pd(R.UNTIL):null,max=R.COUNT?+R.COUNT:Infinity;
  const dur=e.end-e.start,ex=new Set((e.x||[]).map(d=>+d));
  const days=R.BYDAY?R.BYDAY.split(',').map(s=>['SU','MO','TU','WE','TH','FR','SA'].indexOf(s.slice(-2))):null;
  const s0=sod(e.start),out=[];let n=0;
  for(let d=new Date(e.start),i=0;d<=to&&(!until||d<=until)&&n<max&&i<6000;d=add(d,1),i++){
    const k=Math.round((sod(d)-s0)/864e5);let ok=false;
    if(R.FREQ==='DAILY')ok=k%step===0;
    else if(R.FREQ==='WEEKLY'){const w=Math.round((sod(add(d,-d.getDay()))-sod(add(e.start,-e.start.getDay())))/6048e5);
      ok=w%step===0&&(days?days.includes(d.getDay()):d.getDay()===e.start.getDay())}
    else if(R.FREQ==='MONTHLY')ok=d.getDate()===e.start.getDate()&&((d.getFullYear()-e.start.getFullYear())*12+d.getMonth()-e.start.getMonth())%step===0;
    else if(R.FREQ==='YEARLY')ok=d.getDate()===e.start.getDate()&&d.getMonth()===e.start.getMonth()&&(d.getFullYear()-e.start.getFullYear())%step===0;
    if(!ok)continue;
    n++;
    const end=new Date(+d+dur);
    if(end>from&&!ex.has(+d))out.push({...e,start:new Date(d),end,r:null});
  }
  return out;
}

/* Live feeds: set WORKER to your Cloudflare Worker URL and list your feeds.
   id must match a key in the Worker; cal is maya, leo or family. */
const WORKER='https://kidcalendar-feeds.ben-langhorst.workers.dev/';
const FEEDS=[{id:'first',cal:'family'}];

async function loadFeeds(){
  if(WORKER.includes('YOUR-WORKER'))return;
  const all=[],failed=[];
  for(const f of FEEDS){
    try{
      const r=await fetch(`${WORKER}/?id=${encodeURIComponent(f.id)}`);
      if(!r.ok)throw new Error(r.status);
      all.push(...parseICS(await r.text()).map(e=>({...e,cal:f.cal})));
    }catch(err){failed.push(f.id)}
  }
  events=all.flatMap(e=>expand(e));
  document.getElementById('note').textContent=failed.length?`Couldn’t load: ${failed.join(', ')}. Check the Worker URL and feed names.`:`Loaded ${FEEDS.length} calendar${FEEDS.length>1?'s':''}.`;
  render();
}
legend();render();loadFeeds();
</script>
</body>
</html>
